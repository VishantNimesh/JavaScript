    <style>
        /* input event k liye */
        h3{
            text-transform: capitalize;
        }

        /* select event */
        input{
            display: block;
            color: rgb(90, 61, 11);
            background-attachment:local;
            background-color: beige;
        }
        #main{

            height: 100%;
            background-color: #222;
        }

        .card{
            max-width: 250px;
            color: white;
            margin-top: 30px;
            border-radius: 5px;
            display: inline-block;
            padding: 10px;
            border: 1px solid #e3e3e3;
        }

        .profile{
            width: 50px;
            height: 50px;
            /* background-color: red; */        /* isliye htaya kyonki iski jgha image lgare hai*/
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden;
        }

        .profile img{
            width: 60px;
            height: 60px;
            object-fit: cover;
        }

        .card h5 {
            margin-top: 3px;
        }

        .card p{
            font-size: 12px;
            margin-top: 10px;
        }

    </style>
