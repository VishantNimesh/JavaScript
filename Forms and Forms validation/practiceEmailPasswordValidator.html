<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email & Password Validator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Login Validator</h1>

        <form id="loginForm">

            <div class="input-box">
                <label for="email">Email</label>
                <input 
                    type="text" 
                    id="email" 
                    placeholder="Enter your email"
                    autocomplete="off" 
                >
                <p id="emailError"></p>
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password"
                    autocomplete="off"
                >
                <p id="passwordError"></p>
            </div>

            <button type="submit" id="validateBtn">
                Validate
            </button>

            <p id="result">
                <!-- There are errors.  -->
            </p>

        </form>


    </div>

    <script src="practice.js"></script>
</body>
</html>
